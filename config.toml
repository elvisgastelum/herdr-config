onboarding = false

[ui]
prompt_new_tab_name = false
agent_panel_sort = "priority"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "terminal_title_stripped", dim = false, fg = "#a0a0a0" }],
  [{ token = "workspace", dim = true, bold = false }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
]

[keys]
detach = "prefix+d"
switch_tab = "alt+1..9"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "elvisgastelum.port-forward.open"
description = "port forwards"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "elvisgastelum.port-kill.open"
description = "kill process by port"
